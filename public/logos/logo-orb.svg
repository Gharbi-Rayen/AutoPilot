<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="AutoPilot logo">
  <!-- Rainbow ring segments approximating conic-gradient(from 210deg, ...) -->
  <!-- Segment 1: red #ff3b30 210°→260° -->
  <path d="M20,20 L4.67,30 A18,18,0,0,1,4.67,10 Z" fill="#ff3b30"/>
  <!-- Segment 2: orange #ff9500 260°→305° -->
  <path d="M20,20 L4.67,10 A18,18,0,0,1,20,2 Z" fill="#ff9500"/>
  <!-- Segment 3: yellow #ffd60a 305°→360° -->
  <path d="M20,20 L20,2 A18,18,0,0,1,35.33,10 Z" fill="#ffd60a"/>
  <!-- Segment 4: green #34c759 0°→45° -->
  <path d="M20,20 L35.33,10 A18,18,0,0,1,38,20 Z" fill="#34c759"/>
  <!-- Segment 5: teal #00c7be 45°→90° -->
  <path d="M20,20 L38,20 A18,18,0,0,1,35.33,30 Z" fill="#00c7be"/>
  <!-- Segment 6: blue #0a84ff 90°→135° -->
  <path d="M20,20 L35.33,30 A18,18,0,0,1,20,38 Z" fill="#0a84ff"/>
  <!-- Segment 7: indigo #5e5ce6 135°→180° -->
  <path d="M20,20 L20,38 A18,18,0,0,1,4.67,30 Z" fill="#5e5ce6"/>
  <!-- Inner white disc -->
  <circle cx="20" cy="20" r="14" fill="white"/>
  <!-- "AP" monogram -->
  <text
    x="20" y="24"
    text-anchor="middle"
    font-family="JetBrains Mono, monospace"
    font-weight="500"
    font-size="10"
    letter-spacing="-0.5"
    fill="#18181b"
  >AP</text>
</svg>
