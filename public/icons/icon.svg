<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AutoPilot logo">
  <!-- Dark background (fills entire square for maskable icon support) -->
  <rect width="512" height="512" fill="#09090b"/>

  <!-- Rainbow ring pie-slices (r=18 in local coords, scaled 11.5× to fill icon)   -->
  <!-- Transform: centers the 40×40 orb at (256,256) with ~10% padding all sides    -->
  <g transform="translate(26,26) scale(11.5)">

    <!-- Segment 1: red  #ff3b30  147°→213° -->
    <path d="M20,20 L4.67,30 A18,18,0,0,1,4.67,10 Z" fill="#ff3b30"/>
    <!-- Segment 2: orange #ff9500  213°→270° -->
    <path d="M20,20 L4.67,10 A18,18,0,0,1,20,2 Z" fill="#ff9500"/>
    <!-- Segment 3: yellow #ffd60a  270°→327° -->
    <path d="M20,20 L20,2 A18,18,0,0,1,35.33,10 Z" fill="#ffd60a"/>
    <!-- Segment 4: green  #34c759  327°→0° -->
    <path d="M20,20 L35.33,10 A18,18,0,0,1,38,20 Z" fill="#34c759"/>
    <!-- Segment 5: teal   #00c7be  0°→33° -->
    <path d="M20,20 L38,20 A18,18,0,0,1,35.33,30 Z" fill="#00c7be"/>
    <!-- Segment 6: blue   #0a84ff  33°→90° -->
    <path d="M20,20 L35.33,30 A18,18,0,0,1,20,38 Z" fill="#0a84ff"/>
    <!-- Segment 7: indigo #5e5ce6  90°→147° -->
    <path d="M20,20 L20,38 A18,18,0,0,1,4.67,30 Z" fill="#5e5ce6"/>

    <!-- Inner white disc — covers pie-slice centers to create ring effect -->
    <circle cx="20" cy="20" r="14" fill="#ffffff"/>

    <!-- "AP" monogram -->
    <text
      x="20" y="24"
      text-anchor="middle"
      font-family="'JetBrains Mono', 'Courier New', monospace"
      font-weight="600"
      font-size="10"
      letter-spacing="-0.5"
      fill="#09090b"
    >AP</text>
  </g>
</svg>
